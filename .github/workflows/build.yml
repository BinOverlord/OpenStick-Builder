name: Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Target board devicetree'
        required: true
        default: 'yiming-uz801v3'
        type: choice
        options:
          - yiming-uz801v3
          - thwc-uf896
          - thwc-ufi001c
          - jz01-45-v33
          - fy-mf800
      runner:
        description: 'Runner label (e.g. ubuntu-latest, self-hosted)'
        required: true
        default: 'ubuntu-latest'
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo sh -e scripts/install_deps.sh

      - name: Build hyp and aboot firmware
        run: sudo sh -e scripts/build_hyp_aboot.sh

      - name: Extract MSM8916 firmware
        run: sudo sh -e scripts/extract_fw.sh

      - name: Create rootfs
        run: sudo BOARD=${{ inputs.board }} sh -e scripts/debootstrap.sh

      - name: Build gadget-tool
        run: sudo sh -e scripts/build_gt.sh

      - name: Create images
        run: sudo sh -e scripts/build_images.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-debian-${{ inputs.board }}
          path: files/*
